# Provider-agnostic production compose example for ZEX-Platform.
#
# REQUIRED before `docker compose up`:
#   export ZEX_PLATFORM_IMAGE=registry.example/zex-platform:<immutable-sha>
#   # or set in a private env file — never default to :latest
#
# Prefer managed Postgres/Redis via DATABASE_URL / REDIS_URL.
# The optional postgres/redis services below are SELF-HOSTED EXAMPLES only
# (parity / lab). Do not treat them as the only production topology.
#
# Promotion sequence (see docs/PRODUCTION_RUNBOOK.md):
#   backup → migrate (one-shot) → app up → health → smoke

name: zex-platform-production

services:
  migrate:
    image: ${ZEX_PLATFORM_IMAGE:?ZEX_PLATFORM_IMAGE must be set to an immutable image ref (never latest)}
    profiles: ["migrate"]
    env_file:
      - ${ZEX_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    # Wire to external DB only — no dependency on local postgres service unless you attach networks.

  api:
    image: ${ZEX_PLATFORM_IMAGE:?ZEX_PLATFORM_IMAGE must be set to an immutable image ref (never latest)}
    env_file:
      - ${ZEX_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      ZEX_RELEASE_SHA: ${ZEX_RELEASE_SHA:-}
    ports:
      - "${ZEX_PUBLISH_PORT:-3000}:3000"
    restart: unless-stopped
    # When using self-hosted example infra below, uncomment:
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ---------------------------------------------------------------------------
  # OPTIONAL self-hosted example infrastructure (lab / parity only)
  # Enable with: docker compose --profile selfhosted -f deploy/docker-compose.production.yml up -d
  # Production should normally use managed DATABASE_URL / REDIS_URL instead.
  # ---------------------------------------------------------------------------
  postgres:
    profiles: ["selfhosted"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zex_platform}
      POSTGRES_USER: ${POSTGRES_USER:-zex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required for selfhosted profile}
    volumes:
      - zex_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do not publish ports publicly in real production; example binds localhost only.
    ports:
      - "127.0.0.1:${ZEX_SELFHOSTED_PG_PORT:-5435}:5432"

  redis:
    profiles: ["selfhosted"]
    image: redis:7-alpine
    # AOF + noeviction: queues must not silently drop jobs under memory pressure.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - zex_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${ZEX_SELFHOSTED_REDIS_PORT:-6381}:6379"

volumes:
  zex_prod_pgdata:
  zex_prod_redis:
