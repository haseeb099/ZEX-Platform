name: ZEX Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zex
          POSTGRES_PASSWORD: zex
          POSTGRES_DB: zex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zex -d zex_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://zex:zex@localhost:5432/zex_test?schema=public
      REDIS_URL: redis://localhost:6379
      MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      ADMIN_API_KEY: ci-only-admin-api-key-at-least-32-characters
      TWENTY_GRAPHQL_URL: http://localhost:9999/graphql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=0

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build
